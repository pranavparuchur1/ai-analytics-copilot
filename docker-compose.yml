services:
  warehouse:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
      POSTGRES_USER: ${WAREHOUSE_ADMIN_USER:-warehouse_admin}
      POSTGRES_PASSWORD: ${WAREHOUSE_ADMIN_PASSWORD:-admin_dev_only}
      COPILOT_RO_PASSWORD: ${COPILOT_RO_PASSWORD:-copilot_ro_dev_only}
    ports:
      - "${WAREHOUSE_PORT:-5433}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./infrastructure/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The web app. Start with `docker compose --profile app up --build`.
  # The LLM is not containerised here: it runs on the GPU in WSL behind the inference-gateway
  # (scripts/serve_llm.sh) and the container reaches it through host.docker.internal.
  copilot:
    profiles: ["app"]
    build: .
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: 5432
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
      COPILOT_RO_PASSWORD: ${COPILOT_RO_PASSWORD:-copilot_ro_dev_only}
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-coder}
    ports:
      - "8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  warehouse-data:
