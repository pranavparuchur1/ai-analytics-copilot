# --- group by / joins -----------------------------------------------------------------
- id: q19
  split: dev
  category: breakdown
  question: Show revenue by product category in 2025.
  gold_sql: |
    SELECT p.category, ROUND(SUM(oi.quantity * oi.unit_price - oi.discount), 2)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    WHERE o.status = 'completed' AND o.ordered_at >= '2025-01-01' AND o.ordered_at < '2026-01-01'
    GROUP BY p.category
