# Golden question set. "Today" is 2026-10-01 (config.AS_OF_DATE): last month = September 2026,
# last quarter = Q3 2026 (Jul-Sep), this year = 2026, last year = 2025.
#
# kind: sql      -> scored by execution accuracy: the predicted query's result must match
#                   the gold query's result (column names ignored, extra columns allowed;
#                   row order only checked when order_matters is true).
# kind: refuse   -> the copilot must decline (personal data, writes, out-of-scope).
# kind: why      -> diagnostic question; scored on whether the analysis names the planted
#                   driver (expect_driver: {dimension, value}).
# split: dev questions were used while building prompts; test questions were held out.

- id: q01
  split: dev
  category: aggregate
  question: How many completed orders do we have in total?
  gold_sql: SELECT COUNT(*) FROM orders WHERE status = 'completed'
- id: q02
  split: test
  category: aggregate
  question: What is our total revenue across all time?
  gold_sql: |
    SELECT ROUND(SUM(oi.quantity * oi.unit_price - oi.discount), 2)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id WHERE o.status = 'completed'
- id: q03
  split: dev
  category: aggregate
  question: How many products are in the catalogue?
  gold_sql: SELECT COUNT(*) FROM products
- id: q04
  split: test
  category: aggregate
  question: How many customers are in the gold loyalty tier?
  gold_sql: SELECT COUNT(*) FROM customers WHERE loyalty_tier = 'gold'
- id: q05
  split: dev
  category: aggregate
  question: How many orders were cancelled in 2025?
  gold_sql: |
    SELECT COUNT(*) FROM orders WHERE status = 'cancelled'
      AND ordered_at >= '2025-01-01' AND ordered_at < '2026-01-01'
- id: q06
  split: test
  category: aggregate
  question: What is the average list price of products in the Snow category?
  gold_sql: SELECT ROUND(AVG(list_price), 2) FROM products WHERE category = 'Snow'
- id: q07
  split: test
  category: aggregate
  question: How many stores do we have in California, not counting online?
  gold_sql: SELECT COUNT(*) FROM stores WHERE state = 'CA'
- id: q08
  split: dev
  category: aggregate
  question: How much did we spend on marketing in total in 2025?
  gold_sql: |
    SELECT ROUND(SUM(amount), 2) FROM marketing_spend
    WHERE spend_date >= '2025-01-01' AND spend_date < '2026-01-01'
- id: q09
  split: test
  category: aggregate
  question: How many orders used the FALL25 promo code?
  gold_sql: SELECT COUNT(*) FROM orders WHERE promo_code = 'FALL25'
- id: q10
  split: test
  category: aggregate
  question: What is the total amount refunded for returns in 2026?
  gold_sql: |
    SELECT ROUND(SUM(refund_amount), 2) FROM returns
    WHERE returned_on >= '2026-01-01' AND returned_on < '2027-01-01'

