# --- ranking --------------------------------------------------------------------------
- id: q29
  split: dev
  category: ranking
  question: What were our top five products by revenue last quarter?
  order_matters: true
  gold_sql: |
    SELECT p.product_name, ROUND(SUM(oi.quantity * oi.unit_price - oi.discount), 2) AS revenue
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    WHERE o.status = 'completed' AND o.ordered_at >= '2026-07-01' AND o.ordered_at < '2026-10-01'
    GROUP BY p.product_name ORDER BY revenue DESC LIMIT 5
- id: q30
  split: test
  category: ranking
  question: Which three stores had the highest revenue in 2025? Exclude the online store.
  order_matters: true
  gold_sql: |
    SELECT s.store_name, ROUND(SUM(oi.quantity * oi.unit_price - oi.discount), 2) AS revenue
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN stores s ON s.store_id = o.store_id
    WHERE o.status = 'completed' AND s.channel <> 'online'
      AND o.ordered_at >= '2025-01-01' AND o.ordered_at < '2026-01-01'
    GROUP BY s.store_name ORDER BY revenue DESC LIMIT 3
- id: q31
  split: test
  category: ranking
  question: Which 5 products sold the most units in 2026?
  order_matters: true
  gold_sql: |
    SELECT p.product_name, SUM(oi.quantity) AS units
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    WHERE o.status = 'completed' AND o.ordered_at >= '2026-01-01' AND o.ordered_at < '2027-01-01'
    GROUP BY p.product_name ORDER BY units DESC LIMIT 5
- id: q32
  split: dev
  category: ranking
  question: Which state had the highest revenue last month?
  gold_sql: |
    SELECT o.ship_state FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.ordered_at >= '2026-09-01' AND o.ordered_at < '2026-10-01'
    GROUP BY o.ship_state ORDER BY SUM(oi.quantity * oi.unit_price - oi.discount) DESC LIMIT 1
- id: q33
  split: test
  category: ranking
  question: Which product has the most returns of all time?
  gold_sql: |
    SELECT p.product_name FROM returns r JOIN order_items oi ON oi.order_item_id = r.order_item_id
    JOIN products p ON p.product_id = oi.product_id
    GROUP BY p.product_name ORDER BY COUNT(*) DESC LIMIT 1
- id: q34
  split: test
  category: ranking
  question: What are the 3 most expensive products by list price?
  order_matters: true
  gold_sql: SELECT product_name, list_price FROM products ORDER BY list_price DESC LIMIT 3
- id: q35
  split: test
  category: ranking
  question: Which brand generated the most revenue in 2025?
  gold_sql: |
    SELECT p.brand FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    WHERE o.status = 'completed' AND o.ordered_at >= '2025-01-01' AND o.ordered_at < '2026-01-01'
    GROUP BY p.brand ORDER BY SUM(oi.quantity * oi.unit_price - oi.discount) DESC LIMIT 1

