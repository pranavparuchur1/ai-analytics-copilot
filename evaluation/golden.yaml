# --- comparisons ----------------------------------------------------------------------
- id: q43
  split: dev
  category: comparison
  question: Compare revenue in California and Texas last quarter.
  gold_sql: |
    SELECT o.ship_state, ROUND(SUM(oi.quantity * oi.unit_price - oi.discount), 2)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.ship_state IN ('CA', 'TX')
      AND o.ordered_at >= '2026-07-01' AND o.ordered_at < '2026-10-01'
    GROUP BY o.ship_state
- id: q44
  split: test
  category: comparison
  question: What share of last quarter's revenue came from online orders? Give a fraction between 0 and 1.
  gold_sql: |
    SELECT ROUND(SUM(oi.quantity * oi.unit_price - oi.discount) FILTER (WHERE o.channel = 'online')
                 / SUM(oi.quantity * oi.unit_price - oi.discount), 4)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.ordered_at >= '2026-07-01' AND o.ordered_at < '2026-10-01'
- id: q45
  split: test
  category: comparison
  question: Compare the number of completed orders in Q3 2025 and Q3 2026.
  gold_sql: |
    SELECT EXTRACT(YEAR FROM ordered_at) AS year, COUNT(*) FROM orders
    WHERE status = 'completed' AND (
      (ordered_at >= '2025-07-01' AND ordered_at < '2025-10-01') OR
      (ordered_at >= '2026-07-01' AND ordered_at < '2026-10-01'))
    GROUP BY 1
- id: q46
  split: test
  category: comparison
  question: How did Camping revenue in California compare between August and September 2026?
  gold_sql: |
    SELECT date_trunc('month', o.ordered_at) AS month,
           ROUND(SUM(oi.quantity * oi.unit_price - oi.discount), 2)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    WHERE o.status = 'completed' AND o.ship_state = 'CA' AND p.category = 'Camping'
      AND o.ordered_at >= '2026-08-01' AND o.ordered_at < '2026-10-01'
    GROUP BY 1
- id: q47
  split: dev
  category: comparison
  question: Compare total revenue for in-store and online orders in 2024.
  gold_sql: |
    SELECT o.channel, ROUND(SUM(oi.quantity * oi.unit_price - oi.discount), 2)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.ordered_at >= '2024-01-01' AND o.ordered_at < '2025-01-01'
    GROUP BY o.channel

# --- harder -----------------------------------------------------------------------------
- id: q48
  split: dev
  category: advanced
  question: What is the return rate (returned order lines divided by order lines) for each product category, for completed orders in 2025?
  gold_sql: |
    SELECT p.category, ROUND(COUNT(DISTINCT r.order_item_id)::numeric / COUNT(DISTINCT oi.order_item_id), 4)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    LEFT JOIN returns r ON r.order_item_id = oi.order_item_id
    WHERE o.status = 'completed' AND o.ordered_at >= '2025-01-01' AND o.ordered_at < '2026-01-01'
    GROUP BY p.category
- id: q49
  split: test
  category: advanced
  question: What was the gross margin by category last quarter?
  gold_sql: |
    SELECT p.category, ROUND(SUM(oi.quantity * (oi.unit_price - p.unit_cost) - oi.discount), 2)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    WHERE o.status = 'completed' AND o.ordered_at >= '2026-07-01' AND o.ordered_at < '2026-10-01'
    GROUP BY p.category
- id: q50
  split: test
  category: advanced
  question: Which products are currently out of stock at a California store? List distinct product names.
  gold_sql: |
    SELECT DISTINCT p.product_name FROM stockouts so
    JOIN stores s ON s.store_id = so.store_id JOIN products p ON p.product_id = so.product_id
    WHERE s.state = 'CA' AND so.ended_on IS NULL
- id: q51
  split: test
  category: advanced
  question: How many distinct customers placed at least one completed order in 2025?
  gold_sql: |
    SELECT COUNT(DISTINCT customer_id) FROM orders WHERE status = 'completed'
      AND ordered_at >= '2025-01-01' AND ordered_at < '2026-01-01'
- id: q52
  split: dev
  category: advanced
  question: For each month of 2026, what was revenue and the percent change from the previous month?
  gold_sql: |
    WITH m AS (
      SELECT date_trunc('month', o.ordered_at) AS month,
             SUM(oi.quantity * oi.unit_price - oi.discount) AS revenue
      FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.status = 'completed' AND o.ordered_at >= '2025-12-01' AND o.ordered_at < '2026-10-01'
      GROUP BY 1),
    c AS (
      SELECT month, revenue,
             100 * (revenue - LAG(revenue) OVER (ORDER BY month)) / LAG(revenue) OVER (ORDER BY month) AS pct
      FROM m)
    SELECT month, ROUND(revenue, 2), ROUND(pct, 2) FROM c WHERE month >= '2026-01-01'
- id: q53
  split: test
  category: advanced
  question: What was the return rate of the Granite Peak Summit Down Jacket for orders placed March through May 2026? Use returned lines divided by lines sold.
  gold_sql: |
    SELECT ROUND(COUNT(DISTINCT r.order_item_id)::numeric / COUNT(DISTINCT oi.order_item_id), 4)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    LEFT JOIN returns r ON r.order_item_id = oi.order_item_id
    WHERE o.status = 'completed' AND p.product_name = 'Granite Peak Summit Down Jacket'
      AND o.ordered_at >= '2026-03-01' AND o.ordered_at < '2026-06-01'
- id: q54
  split: test
  category: advanced
  question: What was the average number of items (order lines) per completed order in 2025?
  gold_sql: |
    SELECT ROUND(COUNT(oi.order_item_id)::numeric / COUNT(DISTINCT o.order_id), 2)
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.ordered_at >= '2025-01-01' AND o.ordered_at < '2026-01-01'
- id: q55
  split: test
  category: advanced
  question: What was revenue per dollar of marketing spend in each state in 2025?
  gold_sql: |
    WITH rev AS (
      SELECT o.ship_state AS state, SUM(oi.quantity * oi.unit_price - oi.discount) AS revenue
      FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.status = 'completed' AND o.ordered_at >= '2025-01-01' AND o.ordered_at < '2026-01-01'
      GROUP BY 1),
    spend AS (
      SELECT state, SUM(amount) AS spend FROM marketing_spend
      WHERE spend_date >= '2025-01-01' AND spend_date < '2026-01-01' GROUP BY 1)
    SELECT rev.state, ROUND(rev.revenue / spend.spend, 2) FROM rev JOIN spend USING (state)
- id: q56
  split: dev
  category: advanced
  question: How many customers who signed up in 2025 placed a completed order in 2026?
  gold_sql: |
    SELECT COUNT(DISTINCT c.customer_id) FROM customers c JOIN orders o ON o.customer_id = c.customer_id
    WHERE c.signup_date >= '2025-01-01' AND c.signup_date < '2026-01-01'
      AND o.status = 'completed' AND o.ordered_at >= '2026-01-01' AND o.ordered_at < '2027-01-01'

